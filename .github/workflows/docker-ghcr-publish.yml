name: Build and publish forge image

# Build a CUDA 12.8 + flash-attn 2.8.3 + reliquary (forge) image and push
# to ghcr.io/reliquadotai/reliquary-forge on every commit to main.
#
# Tags:
#   - latest        (only on main branch)
#   - sha-<short>   (every build, for pinned operator deploys)
#
# Parallel-work credit: romain13190/reliquary@b78ef76 — same shape, our
# image name and registry path.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/reliquary-forge
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
